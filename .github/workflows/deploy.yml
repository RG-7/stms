name: Deploy - Production Builds

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-production-apk:
    name: Build Production Android APK
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Production APK
        run: flutter build apk --split-per-abi --release
      
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  build-production-aab:
    name: Build Production Android App Bundle (AAB)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Production AAB
        run: flutter build appbundle --release
      
      - name: Upload AAB to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-production-web:
    name: Build Production Web App
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Production Web
        run: flutter build web --release --web-renderer html
      
      - name: Upload Web to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-web
          path: build/web/
          retention-days: 30
      
      - name: Deploy to GitHub Pages (if main/sliet branch)
        if: github.ref == 'refs/heads/sliet' || github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

  build-production-ios:
    name: Build Production iOS IPA
    runs-on: macos-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      
      - name: Upload iOS build to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-ios
          path: build/ios/iphoneos/
          retention-days: 30

  create-release-summary:
    name: Create Release Summary
    runs-on: ubuntu-latest
    needs: [build-production-apk, build-production-aab, build-production-web, build-production-ios]
    if: success()
    
    steps:
      - name: Create Deployment Summary
        run: |
          echo "✅ Production build completed successfully!"
          echo ""
          echo "📦 Artifacts:"
          echo "- Android APK: Available in production-apk"
          echo "- Android AAB: Available in production-aab"
          echo "- Web: Available in production-web (also deployed to GitHub Pages)"
          echo "- iOS: Available in production-ios"
          echo ""
          echo "🚀 Environment: ${{ github.event.inputs.environment }}"
          echo "📅 Build Date: $(date)"
